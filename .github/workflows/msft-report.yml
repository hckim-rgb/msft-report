name: MSFT Daily Report

on:
  schedule:
    # 10:00 Asia/Seoul = 01:00 UTC
    - cron: "0,10,20,30,40,50 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
      NEWS_QUERY: Microsoft OR Azure OR Windows OR Copilot OR GitHub OR MSFT
      NEWS_LIMIT: "30"
      LOOKBACK_HOURS: "24"
      REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/msft-report.html

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate report
        run: python ms_kakao_news_bot.py --generate-only

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Kakao message
        run: python ms_kakao_news_bot.py --send-only
